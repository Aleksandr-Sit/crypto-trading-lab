# Что собираем с CryptoQuant ежедневно (бесплатный тариф = окно 30 суток, глубже 400).
#
# Монеты. `sol` на бесплатном тарифе закрыт (403), `btc`, `eth`, `xrp` открыты — проверено
# вызовом 14.09.2026. Лишняя монета в списке не ломает сбор, а попадает в пропуски.
#
# Площадки. `all_exchange` — агрегат по рынку, он же самый ценный ряд; отдельные биржи
# нужны, чтобы видеть, ГДЕ выносит плечо, а не только сколько.
#
# Цена вопроса: (монеты × площадки × 4 точки) + монеты запросов в сутки.
version: 1

assets:
  - btc
  - eth
  - xrp

exchanges:
  - all_exchange
  - binance
  - bybit
  - okx

# Пауза между запросами. Лимит бесплатного тарифа не документирован; секунда —
# заведомо вежливо и на длительность задания не влияет.
pause_s: 1.0
