# Раскладка капитала и лимиты веток (спецификация, В9/В9а, R30i).
# Стоп ветки — предохранитель поверх стопов стратегий: при пробое встают стратегии
# этой ветки, остальные работают. Стоп самой стратегии — в её манифесте (G04).
#
# max_trade_base: bank   — процент от всего банка
#                 branch — процент от капитала ветки
# max_leverage: 1 — без плеча.
# maintenance_margin_pct: поддерживающая маржа площадки, % — расстояние до ликвидации
#                 считается как 100/плечо − эта величина (R20.1); по умолчанию 0.5.
# Изменения применяются без рестарта и пишутся в журнал (R30i.4, тикет ops).

# Потолок реального капитала первой фазы, USD (В1: $500–1 000). Переопределяется
# переменной REAL_CAPITAL_CAP из .env.
real_capital_cap_usd: 1000

groups:
  cex:
    branches: [cex-spot, cex-perp, dex-perp]
    share_pct: 40
    max_trade_pct: 2
    max_trade_base: bank
    # ×3, а не ×5 (решение владельца 2, 27.09.2026): у трейдеров HL больше плеча — хуже
    # результат на единицу риска (−0.21 ±0.09, п.2 плана трейдеров).
    max_leverage: 3
    maintenance_margin_pct: 0.5
    stop: {loss_pct: 5, period: day}

  copy:
    branches: [copy]
    # 25 → 5: двадцать процентов отданы ярусу размещения (решение владельца 4, 27.09.2026).
    share_pct: 5
    max_trade_pct: 3
    max_trade_base: bank
    # ×3; плечо следует за лидером, поэтому лидер выше ×3 получит отказ, а не уменьшенную копию.
    max_leverage: 3
    leverage_follows_leader: true
    maintenance_margin_pct: 0.5
    stop: {loss_pct: 5, period: day}

  meme:
    branches: [meme]
    share_pct: 20
    max_trade_pct: 10
    max_trade_base: branch
    max_leverage: 1
    stop: {loss_pct: 20, period: day}

  nft:
    branches: [nft]
    share_pct: 10
    max_trade_pct: 25
    max_trade_base: branch
    max_leverage: 1
    stop: {loss_pct: 30, period: week}

  prediction:
    branches: [prediction, rh]
    share_pct: 5
    max_trade_pct: 20
    max_trade_base: branch
    max_leverage: 1
    stop: {loss_pct: 20, period: week}

# Ярус размещения (решение владельца 4, 27.09.2026; docs/research/allocator-2026-09-27.md).
# Для правил, которые держат актив ЦЕЛИКОМ: карточка объявляет `allocation: true`
# (lab.contracts.allocation), и такая стратегия идёт по этим лимитам, а не по группе своей
# ветки. Доля — 20% банка, взятые из `copy`; сделка — до всей доли яруса (max_trade_pct —
# процент ДОЛИ ЯРУСА); без плеча. Стопа ветки у яруса нет: работает собственный стоп
# стратегии (`stop_loss_pct` карточки), и считается он от ВЕРШИНЫ капитала стратегии
# с открытой позицией по текущей цене — одинаково в замере и в бою. Сделки яруса не входят
# ни в стоп, ни в занятость ветки, где живёт стратегия. Возврат после стопа — только оператором.
# Довод к цифрам: худшая просадка ротации в замере — 25% от вершины; ярус в 20% банка теряет
# при ней 5% банка — как дневной стоп группы `cex`. Стоп 35% даёт запас ×1.4.
allocation_tier:
  share_pct: 20
  max_trade_pct: 100
  max_leverage: 1
