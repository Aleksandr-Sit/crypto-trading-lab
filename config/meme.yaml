# Мем-коины и ранние стадии (Истории 65–71). Параметры меняются здесь, не в коде.
version: 1

# Первичный фильтр потока (История 71): оцениваются все токены, полную историю
# получают только прошедшие; по остальным остаются агрегаты.
stream:
  max_tracked: 500              # сколько токенов держим с полной историей
  max_history_per_token: 200    # событий на токен
  aggregate_window_min: 60      # окно агрегатов по отсеянным
  min_liquidity_usd: 3000
  min_volume_usd: 1000
  min_buys: 5
  max_age_min: 180              # старше — не «ранняя стадия»

# Чек-лист честности (История 67). Провал любого пункта запрещает покупку.
honesty:
  require_mint_revoked: true
  require_freeze_revoked: true
  max_top_holder_pct: 25        # доля крупнейшего держателя
  max_top10_pct: 60             # доля первой десятки
  min_liquidity_usd: 5000
  min_age_s: 60
  blocklist: []                 # адреса создателей и токенов, с которыми не работаем

# Исполнение свопов (История 66): защита от проскальзывания и приоритетные fee.
execution:
  max_slippage_pct: 5           # выше — отказ без отправки
  slippage_pct: 1.5             # запрашиваемая защита в маршруте
  priority_fee_usd: 0.05
  max_priority_fee_usd: 1.00    # потолок эскалации по застрявшей транзакции
  retry_priority_multiplier: 2  # «застряла» → повтор с бо́льшим приоритетом
  max_attempts: 3

# Лестница продаж (A05, История 68): частичные цели плюс трейлинг по остатку.
ladder:
  targets:
    - {gain_pct: 60, sell_pct: 40}
    - {gain_pct: 150, sell_pct: 30}
  trailing_pct: 25
  stop_loss_pct: 50
