# Порог прохождения ступени (правило В12):
# Сравнение с бенчмарком — В ГОДОВЫХ (vs_btc_cagr), а не в процентах за окно: у BTC
# сменился режим (в 2011–2013 он рос на +1622% годовых, в 2024–2026 на +3%), и разница
# процентов за длинное окно нечитаема. Устойчивость смотреть командой `lab measure rolling`.
#   ≥ min_trades сделок, EV > min_ev_after_costs после издержек,
#   MaxDD в лимите ветки, результат лучше бенчмарка за тот же период.
min_trades: 30
min_ev_after_costs: 0
benchmark: BTC-buy-and-hold

# Допустимая максимальная просадка замера по группам веток, % (совпадает с limits.yaml).
max_dd_pct:
  cex: 5
  copy: 5
  meme: 20
  nft: 30
  prediction: 20

# Бутстрап доверительного интервала EV.
bootstrap_samples: 1000
confidence: 0.95

# Устойчивость: сколько окон стратегия отработала в плюс и в скольких обошла бенчмарк.
# Одиночное окно — плохая опора: у pifagor-forever-sma вердикт менялся с «преимущество»
# на «разгром» от сдвига границы. Считается только для стратегий, прошедших остальные
# критерии — прогон по окнам дорогой. Отчёт руками: lab measure rolling <id>.
stability:
  window_days: 730        # длина одного окна
  step_days: 180          # шаг между окнами
  min_windows: 6          # меньше окон — статистики нет, критерии не применяются
  min_profitable_pct: 60  # в скольких % окон зарабатывает после издержек
  min_ahead_pct: 50       # в скольких % окон впереди бенчмарка
