# Поиск кандидатов, переизмерение, срок годности и перелив (R15, R14, G05).
# Читают: lab.discovery (источники) и lab.ops.jobs (задания). Расписание — schedule.yaml.

sources:
  # ВЕТКИ copy И prediction ПРИГЛУШЕНЫ (решение владельца 21.09.2026).
  # Принять такого кандидата сегодня нечем: бэктеста у них не бывает по устройству
  # (_PLANS в core.measure.runner), а вперёд их никто не кормит — forward_journal
  # проигрывает стратегии по СВЕЧАМ (on_bar), тогда как копи-правила живут на on_event,
  # и этот метод не вызывается нигде в ops/bot/cli. То есть кнопка «В замер» давала бы
  # запись в реестре и замер `incomplete`, а карточки приходили бы каждую неделю.
  # Включать обратно, когда появится задание, которое опрашивает лидеров и пишет их
  # решения в журнал.
  okx_lead:
    enabled: false
    limit: 20
    inst_type: SWAP
    min_days: 30
    min_win_rate_pct: 50
  hyperliquid:
    enabled: false
    limit: 20
    # Лидерборд не отсортирован по прибыли: 21.09.2026 в карточку приехал лидер
    # с −3.58 млн за месяц. Порог держит таких вне очереди и после включения источника.
    min_pnl_month_usd: 0
    # Community-эндпоинт лидерборда неофициальный: когда он молчит, берём ручной список.
    manual:
      - "0x0000000000000000000000000000000000000000"
  polymarket:
    enabled: false
    limit: 20
    window: all
    order_by: pnl
  smart_money:
    enabled: true
    # Ключей нет — источник честно уходит в degraded и не роняет прогон.
    # Предел и порог — на весь источник: без них ответ провайдера едет в очередь целиком.
    limit: 20
    require_pnl: true
    min_pnl_usd: 0
    providers:
      - id: cielo
        url: https://feed-api.cielo.finance/api/v1/feed
        key_env: CIELO_API_KEY
        weight: 1
        wallet_field: wallet
        chain: solana
      # ВЫКЛЮЧЕН 21.09.2026: запрос 3237025 — это не рейтинг трейдеров, а СПРАВОЧНИК
      # АДРЕСОВ БИРЖ (колонки address, cex_name, distinct_name; Bithumb 550, Coinbase 287,
      # OKX 274, Binance 150). Копировать горячий кошелёк биржи бессмысленно, а поля
      # прибыли в ответе нет вовсе — отбирать не по чему. За один прогон он завёл
      # 4957 кандидатов. Включать только вместе с запросом, который отдаёт трейдеров
      # с их PnL.
      - id: dune
        enabled: false
        url: https://api.dune.com/api/v1/query/3237025/results
        key_env: DUNE_API_KEY
        weight: 10
        wallet_field: address
        chain: ethereum
  github:
    enabled: true
    limit: 10
    min_stars: 50
    branch: cex-spot
    queries:
      - "crypto trading strategy backtest"
      - "hyperliquid trading bot"
  nft_launchpad:
    # Выключен 21.09.2026: по минту кнопка «В замер» ничего не запускает — манифеста
    # из него не вывести, правило кодируется руками. Включать, когда NFT-ветка станет
    # предметом работы.
    enabled: false
    limit: 20
    markets:
      - magiceden
    calendars:
      - nftcalendar
  seed:
    enabled: true
    path: candidates/seed.md

# Сколько карточек за один прогон уходит в телегу (остальное ждёт в очереди).
max_cards_per_scan: 10

# Сколько суток кандидат ждёт решения, прежде чем уйти в отклонённые сам (задание
# `expiry`, вс 22:15). Решений система не принимает никогда, а поиск идёт каждую неделю:
# без срока годности очередь может только расти — к 21.09.2026 в ней лежало 5075 записей
# и ни одного решения. Вернуть кандидата может сам источник: существенно изменился
# отпечаток — строка снова `pending` (R15.2). 0 — срок не применяется.
candidate_expire_days: 30

remeasure:
  window_days: 90
  # Окно по таймфрейму: порог требует 30 сделок, и дневная стратегия за квартал их
  # не наберёт физически. Без этой таблицы медленная стратегия не может пройти лестницу
  # в принципе — не потому что плоха, а потому что её не успевают измерить.
  window_days_by_tf:
    "1d": 1825
    "1w": 1825
    "4h": 1095
    "1h": 730
  # Без успешного переизмерения столько недель — degraded (R14.1).
  valid_weeks: 4
  mode: backtest
  # Сколько всего минут отведено воскресному прогону: сервер общий, и лаборатория
  # не должна занимать его часами. Не успели — стратегии перечислены в отчёте.
  budget_minutes: 60

rebalance:
  risky_branches: [meme, nft, prediction, copy]
  to_branch: cex-spot
  min_amount_usd: 50
