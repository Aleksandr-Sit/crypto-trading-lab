# Что собираем с Coinalyze ежедневно: ликвидации и открытый интерес по монетам.
#
# Агрегата по площадкам источник НЕ отдаёт, поэтому здесь перечислены символы главных
# перпов, а сумма считается нами. Коды площадок: .A — Binance, .6 — Bybit, .3 — OKX.
# Полный справочник — точка `future-markets` (5339 рынков на 14.09.2026).
#
# Ряд пишется под псевдоплощадкой `all_exchange`: это СУММА, а не отдельная биржа.
#
# Цена вопроса: монеты × площадки × 2 точки запросов в сутки. При пяти монетах — 30.
version: 1

markets:
  BTC: [BTCUSDT_PERP.A, BTCUSDT.6, BTCUSD_PERP.3]
  ETH: [ETHUSDT_PERP.A, ETHUSDT.6, ETHUSD_PERP.3]
  SOL: [SOLUSDT_PERP.A, SOLUSDT.6, SOLUSD_PERP.3]
  XRP: [XRPUSDT_PERP.A, XRPUSDT.6, XRPUSD_PERP.3]
  DOGE: [DOGEUSDT_PERP.A, DOGEUSDT.6, DOGEUSD_PERP.3]

# Пауза между запросами. Лимит тарифа — 40 запросов в минуту, то есть полторы секунды
# на запрос это ровно граница; берём с небольшим запасом.
pause_s: 1.6
