# Расписание планировщика (решение §11). Время — в timezone ниже, cron из 5 полей.
timezone: Europe/Samara

jobs:
  discovery:
    cron: "0 6 * * mon"
    description: Еженедельный поиск кандидатов
  remeasure:
    cron: "0 22 * * sun"
    description: Еженедельное переизмерение стратегий
  # тикет 12 — срок годности и одноразовое напоминание G10
  expiry:
    cron: "15 22 * * sun"
    description: Срок годности стратегий (R14.1) — без переизмерения N недель → degraded
  seed_reminder:
    cron: "0 10 * * *"
    description: Одноразовое напоминание G10 «дополни список кандидатов» (шлётся один раз)
  rebalance_proposal:
    cron: "30 22 * * sun"
    description: Предложение перелива излишка рисковых веток (G05)
  morning_report:
    cron: "0 9 * * *"
    description: Утренний отчёт в Telegram
  reconcile:
    cron: "0 4 * * *"
    description: Сверка ордеров и балансов с площадками
  cryptoquant:
    cron: "20 3 * * *"
    description: Суточные ряды CryptoQuant (тариф даёт только 30 суток — копим вперёд)
  coinalyze:
    cron: "40 3 * * *"
    description: Ликвидации и открытый интерес (Coinalyze) — окно источника плывёт
  backup:
    cron: "0 3 * * *"
    description: Резервная копия базы в BACKUP_DIR
  # тикет 05 — служебные задания бота (минутный тик)
  outbox_flush:
    cron: "* * * * *"
    description: Повтор недоставленных сообщений Telegram (outbox)
  expire_signals:
    cron: "* * * * *"
    description: Протухание сигналов без ответа (ttl_s) и правка карточек
  stop_watch:
    cron: "* * * * *"
    description: Пробой стопа стратегии → degraded (Deny(strategy_stop_*) → ladder.breach)
