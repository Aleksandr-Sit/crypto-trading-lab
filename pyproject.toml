[project]
name = "crypto-trading-lab"
version = "0.1.0"
description = "Лаборатория торговых стратегий: реестр, лестница ступеней, замеры, исполнители"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "pyarrow>=25.0.1",
    "duckdb>=1.5.5",
    "numpy>=2.5.2",
]

[project.scripts]
lab = "lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:lab.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".autopilot", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["N818"]  # имена исключений по спецификации: DuplicateStrategy, IncompleteManifest

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
