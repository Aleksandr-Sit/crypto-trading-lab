{% extends "base.html" %}
{% block title %}Кладбище{% endblock %}
{% block content %}
<h1>Кладбище</h1>
<p class="muted">Стратегии со статусом «не прошла» и «снята»: отрицательный результат сохраняется, чтобы не повторять его.</p>
<form class="filters" hx-get="/graveyard" hx-target="#graveyard-table" hx-trigger="change, keyup changed delay:300ms from:input" hx-push-url="true" method="get" action="/graveyard">
  <label>Причина
    <input type="search" name="reason" value="{{ reason }}" list="reasons" placeholder="подстрока причины">
    <datalist id="reasons">{% for r in reasons %}<option value="{{ r }}">{% endfor %}</datalist>
  </label>
  <noscript><button type="submit">Применить</button></noscript>
</form>
<div id="graveyard-table">
  {% include "_graveyard_table.html" %}
</div>
{% endblock %}
