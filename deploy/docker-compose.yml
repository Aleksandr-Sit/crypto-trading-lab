# Запуск: docker compose -f deploy/docker-compose.yml up -d  (из корня репозитория)
# Секреты — из ../.env по именам .env.example. Данные Postgres — в volume lab_pgdata.
#
# ВАЖНО: подстановки ${WEB_BIND}, ${DB_BIND}, ${POSTGRES_PASSWORD} ниже compose берёт
# не из env_file, а из .env РЯДОМ С ЭТИМ ФАЙЛОМ, то есть из deploy/.env. Поэтому
# deploy/setup.sh делает ссылку deploy/.env → ../.env. Если ставите руками — сделайте её
# сами (ln -s ../.env deploy/.env), иначе порт веба и пароль базы молча уедут в умолчания.
name: crypto-trading-lab

x-lab-service: &lab-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      # Версия кода попадает в снимок каждого замера (data_hash + code_version + costs_version).
      # В образе нет .git, поэтому git rev-parse внутри контейнера не сработает — значение
      # передаёт deploy/update.sh. Пусто — замер честно запишет "unknown".
      LAB_CODE_VERSION: ${LAB_CODE_VERSION:-}
  env_file:
    - path: ../.env
      required: false
  environment:
    # Хост базы задан жёстко: внутри compose она всегда "db". Значение DATABASE_URL из .env
    # сюда подставлять нельзя — там адрес для запуска CLI и alembic С ХОСТА (localhost:5432),
    # и контейнер с ним стучится сам в себя: "connection to 127.0.0.1:5432 refused".
    DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD:-lab}@db:5432/lab
  volumes:
    - ../config:/app/config:ro
    - lab_data:/app/data
    - lab_backups:/app/backups
  depends_on:
    db:
      condition: service_healthy
  # Потолок памяти: замер на минутных свечах за длинное окно съедает больше 2 ГБ и
  # попадает под OOM-killer ЯДРА, а тот выбирает жертву по всей машине — рядом живут
  # crypto-trader, wake и smart-money. С лимитом промах убивает только наш контейнер.
  mem_limit: 1200m
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
    volumes:
      - lab_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_BIND:-127.0.0.1:5432}:5432"   # CLI с хоста: DATABASE_URL=...@localhost:5432/lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 640m
    restart: unless-stopped

  migrate:
    <<: *lab-service
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  worker:
    <<: *lab-service
    command: ["uv", "run", "python", "-m", "lab", "service", "worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/lab/worker.heartbeat) )) -lt 60"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  bot:
    <<: *lab-service
    command: ["uv", "run", "python", "-m", "lab", "service", "bot"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/lab/bot.heartbeat) )) -lt 60"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  web:
    <<: *lab-service
    command: ["uv", "run", "python", "-m", "lab", "service", "web"]
    environment:
      # Повторяет анкер: свой environment у сервиса заменяет environment анкера целиком.
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD:-lab}@db:5432/lab
      # WEB_BIND в .env — адрес НА ХОСТЕ (строка ports ниже). Внутри контейнера приложение
      # обязано слушать все интерфейсы и всегда порт 8080: на loopback контейнера
      # docker-proxy достучаться не может, и опубликованный порт молча отвечает отказом.
      WEB_BIND: 0.0.0.0:8080
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/lab/web.heartbeat) )) -lt 60"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  lab_pgdata:
  lab_data:
  lab_backups:
